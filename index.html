<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17271f"><title>Clay's Workout Checklist</title><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><body><main><header><span class="brand">CLAY / TRAINING CHECKLIST</span><span class="dot">●</span></header><aside id="restTimer" class="rest-timer" aria-label="Rest timer" hidden></aside><div id="app"></div><footer>Saved on this device · Dumbbell weights are per hand<br><button id="export">Export backup</button><button id="import">Import backup</button><input id="importFile" type="file" accept="application/json,.json" hidden></footer></main><dialog id="editor"><form id="exerciseForm"><h2 id="formTitle">Add exercise</h2><label>Exercise name<input name="name" required maxlength="80"></label><label>Equipment<select name="equipment"><option>Dumbbells</option><option>Kettlebell</option><option>Bodyweight</option></select></label><div class="grid"><label>Sets<input name="sets" type="number" min="1" max="30" required value="3"></label><label>Target<input name="target" type="number" min="1" max="3600" required value="10"></label></div><label>Measure<select name="measure"><option value="reps">Reps</option><option value="sec">Seconds</option></select></label><label>Weight (kg)<input name="weight" type="number" min="0" step="0.5" required value="0"></label><p class="muted">Dumbbells use the weight of each dumbbell.</p><div class="actions"><button type="button" id="cancelEdit">Cancel</button><button class="primary">Save exercise</button></div></form></dialog><dialog id="recordDialog"><form id="recordForm"><h2 id="recordTitle">Add past set</h2><p id="recordExerciseName"></p><label>Weight (kg)<input name="weight" type="number" inputmode="decimal" min="0" max="10000" step="0.5" required></label><p class="muted" id="recordWeightHint"></p><label><span id="actualLabel">Actual reps</span><input name="actual" type="number" inputmode="numeric" min="0" max="3600" step="1" required></label><label>Workout<select name="sessionId"></select></label><label>When<input name="performedAt" type="datetime-local" required></label><p class="muted" id="recordHint"></p><div class="actions"><button type="button" id="cancelRecord">Cancel</button><button class="primary">Save result</button></div></form></dialog><script src="progression.js"></script><script src="app.js"></script></body></html>
